<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema de Reservas Académicas{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>Sistema de Reservas Académicas</h1>
            <nav>
                <a href="{{ url_for('index') }}">Inicio</a>
                <a href="{{ url_for('spaces.index') }}">Espacios</a>
                <a href="{{ url_for('reservations.index') }}">Reservas</a>
                <a href="{{ url_for('admin.index') }}">Administración</a>
                <a href="{{ url_for('auth.login') }}">Iniciar sesión</a>
            </nav>
        </div>
    </header>
    <main>
        <div class="container">
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer>
        <div class="container">
            <small>Proyecto académico - Reservas de espacios académicos</small>
        </div>
    </footer>
</body>
</html>
